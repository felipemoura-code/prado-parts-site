services:
  adriano-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      BOT_STORE_PATH: /app/data/state.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - adriano_bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  adriano_bot_data:
