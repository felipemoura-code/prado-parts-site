<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Adriano Soluções | Pedidos</title><style>body{margin:0;background:#121214;color:#eee;font:15px system-ui}.bar{height:5px;background:#ffd32c}main{max-width:900px;margin:36px auto;padding:20px}h1{font-size:27px}input{padding:12px;background:#252527;color:#fff;border:1px solid #666;border-radius:9px;min-width:250px}button{padding:13px 19px;background:#ffd32c;color:#111;border:none;border-radius:9px;font-weight:bold}article{border:1px solid #444;border-radius:13px;padding:18px;margin:14px 0;background:#1d1d20}p{overflow-wrap:anywhere}a{color:#ffd32c}</style></head><body><div class="bar"></div><main><h1>⚡ Adriano Soluções — pedidos</h1><p>Somente para administrador. Digite sua chave de acesso.</p><form id="form"><input id="key" type="password" autocomplete="off" required placeholder="Chave de administrador"><button>Consultar</button></form><p id="status" role="status"></p><section id="list"></section></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const list=document.getElementById('list'),status=document.getElementById('status');list.replaceChildren();status.textContent='Consultando...';try{const response=await fetch('/api/leads',{headers:{authorization:'Bearer '+document.getElementById('key').value},cache:'no-store'});if(!response.ok)throw Error('Não autorizado ou indisponível');const data=await response.json();status.textContent=data.total+' pedido(s).';for(const lead of data.leads){const card=document.createElement('article'),h=document.createElement('h2');h.textContent=lead.name||'Cliente';card.appendChild(h);for(const key of ['service','location','address','details','createdAt']){const p=document.createElement('p');p.textContent=({service:'Serviço',location:'Local',address:'Endereço',details:'Detalhes',createdAt:'Data'})[key]+': '+(lead[key]||'-');card.appendChild(p);}if(lead.mapsUrl&&lead.mapsUrl.startsWith('https://www.google.com/maps/dir/?api=1&')){const link=document.createElement('a');link.href=lead.mapsUrl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='📍 Abrir rota';card.appendChild(link);}list.appendChild(card);}}catch(err){status.textContent=err.message;}};</script></body></html>
