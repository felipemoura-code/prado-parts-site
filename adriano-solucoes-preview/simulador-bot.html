<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de atendimento | Adriano Soluções</title><style>*{box-sizing:border-box}body{margin:0;background:#101012;color:#fff;font:15px 'Segoe UI',sans-serif}.warning{max-width:740px;margin:30px auto 15px;padding:0 20px;text-align:center}.warning h1{font-size:27px;margin:0 0 7px}.warning p{color:#aaa;line-height:1.5}.warning strong{color:#ffd32c}.phone{width:min(calc(100% - 25px),465px);height:min(700px,77vh);min-height:450px;display:flex;flex-direction:column;overflow:hidden;margin:0 auto 38px;background:#171719;border:2px solid #53535a;border-radius:24px;box-shadow:0 30px 65px #0006}.header{background:#242426;padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #454545}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffd32c;color:#111;font-size:24px}.header b{display:block}.header small{display:block;color:#aaa;margin-top:4px}.chat{flex:1;overflow:auto;padding:22px 14px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 70% 0,#302910,transparent 35%)}.bubble{padding:13px 16px;border-radius:13px;max-width:86%;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}.bot{align-self:flex-start;background:#303034;border-bottom-left-radius:2px}.user{align-self:flex-end;background:#5a4c17;border-bottom-right-radius:2px}.chat-actions{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:95%}.quick{background:#27220e;color:#ffd32c;border:1px solid #7f671e;padding:9px;border-radius:8px;font:inherit;cursor:pointer}.compose{display:flex;gap:8px;padding:14px;background:#242426}.compose input{flex:1;width:0;background:#111;color:white;border:1px solid #555;border-radius:9px;padding:12px;font:inherit}.compose button{background:#ffd32c;color:#111;border:0;border-radius:9px;font-weight:800;padding:10px 15px;cursor:pointer}.caption{color:#888;font-size:12px;text-align:center;margin-bottom:20px}</style><meta name="robots" content="noindex,nofollow">
</head><body><section class="warning"><h1>⚡ Atendimento Adriano Soluções</h1><p><strong>SIMULAÇÃO LOCAL</strong> — teste o roteiro do bot antes de conectá-lo ao WhatsApp oficial. Nenhuma mensagem é enviada.</p></section><section class="phone"><div class="header"><span class="avatar">⚡</span><span><b>Adriano Soluções</b><small>Prévia do assistente virtual</small></span></div><div id="chat" class="chat" aria-live="polite"></div><form class="compose" id="form"><input id="input" autocomplete="off" placeholder="Digite sua resposta..." aria-label="Sua mensagem"><button>Enviar</button></form></section><div class="caption">Versão demonstrativa, sem conexão com a API Meta.</div><script>const SERV=['Instalação de ventiladores','Instalação de chuveiro','Colocação de tomadas','Ligações em paralelo','Elétrica em geral','Solda'],chat=document.getElementById('chat'),input=document.getElementById('input');let step='menu',data={};function bubble(text,who='bot'){const div=document.createElement('div');div.className='bubble '+who;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight}function menu(){step='menu';data={};bubble('⚡ ADRIANO SOLUÇÕES\n\nComo podemos ajudar?\n\n1. Instalação de ventiladores\n2. Instalação de chuveiro\n3. Colocação de tomadas\n4. Ligações em paralelo\n5. Elétrica em geral\n6. Solda\n7. Falar com Adriano\n\nEscolha um número.');const actions=document.createElement('div');actions.className='chat-actions';['1','2','3','4','5','6','7'].forEach(n=>{const b=document.createElement('button');b.className='quick';b.type='button';b.textContent=n==='7'?'Atendente':n+'. '+SERV[Number(n)-1];b.onclick=()=>reply(n);actions.appendChild(b)});chat.appendChild(actions);chat.scrollTop=chat.scrollHeight}function reply(raw){const text=raw.trim();if(!text)return;bubble(text,'user');document.querySelectorAll('.chat-actions').forEach(x=>x.remove());input.value='';if(/^(menu|0)$/i.test(text))return menu();if(step==='human'){bubble('O atendimento automático está pausado. Digite menu para reiniciar.');return}if(step==='menu'||step==='done'){if(text==='7'){step='human';bubble('A conversa foi encaminhada para atendimento humano. Digite menu para reiniciar.');return}const num=Number(text);if(!Number.isInteger(num)||num<1||num>6)return menu();data.service=SERV[num-1];step='name';bubble('Você escolheu '+data.service+'. Qual é seu nome?');return}if(step==='name'){if(text.length<2)return bubble('Por favor, envie seu nome.');data.name=text;step='location';bubble('Obrigado, '+text+'! Qual é a cidade e o bairro?');return}if(step==='location'){if(text.length<3)return bubble('Informe sua cidade e bairro.');data.location=text;step='details';bubble('Descreva o que precisa instalar, revisar ou consertar.');return}if(step==='details'){if(text.length<5)return bubble('Escreva um pouco mais sobre o serviço, por favor.');data.details=text;step='photo';bubble('Se tiver uma foto, envie pela conversa real no WhatsApp. Nesta simulação, digite finalizar para concluir.');return}if(step==='photo'){if(!/^(finalizar|pular|nao|sem foto)$/i.test(text))return bubble('Digite finalizar para concluir.');step='done';bubble('✅ Solicitação simulada!\n\nNome: '+data.name+'\nServiço: '+data.service+'\nLocal: '+data.location+'\nDescrição: '+data.details+'\n\nNo bot conectado, este pedido ficará salvo para o Adriano avaliar. Digite menu para recomeçar.')}}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();reply(input.value)});menu();</script></body></html>
